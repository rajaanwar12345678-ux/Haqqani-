<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d4e6b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>حقانی کمپوزنگ اینڈ سٹیشنری</title>
<style>
:root{--bg:#f3f5f7;--card:#fff;--ink:#16263a;--mute:#5d6b7b;--line:#dde3e9;--brand:#1d4e6b;--on-brand:#fff;--in:#1e7a52;--out:#b3402f;--due:#a8620a;--soft:#e8eff4;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1720;--card:#18232f;--ink:#e6edf3;--mute:#9fb0c0;--line:#2a3a4a;--brand:#5aa9d1;--on-brand:#0b1620;--in:#4fc08d;--out:#f08a78;--due:#e8a64d;--soft:#1f2f3d}}
:root[data-theme="dark"]{--bg:#0f1720;--card:#18232f;--ink:#e6edf3;--mute:#9fb0c0;--line:#2a3a4a;--brand:#5aa9d1;--on-brand:#0b1620;--in:#4fc08d;--out:#f08a78;--due:#e8a64d;--soft:#1f2f3d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Nastaliq Urdu","Jameel Noori Nastaleeq","Noto Naskh Arabic","Segoe UI",Tahoma,sans-serif;font-size:17px;line-height:1.8}
.wrap{max-width:760px;margin:0 auto;padding:12px 14px 60px}
.hd{background:var(--brand);color:var(--on-brand);margin:-12px -14px 10px;padding:18px 18px 14px;border-radius:0 0 20px 20px;box-shadow:0 4px 14px rgba(0,0,0,.15)}
h1{font-size:23px;margin:0 0 2px;line-height:1.7}
.sub{color:inherit;opacity:.85;margin:0;font-size:14px}
.mh,.tb td,.stat b{font-variant-numeric:tabular-nums}
nav{display:flex;gap:6px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:8px 0;z-index:5}
nav button{flex:1;padding:8px 2px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:15px;font-weight:600;border-radius:12px;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.06)}
nav button.on{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 1px 4px rgba(0,0,0,.07)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.stat{background:var(--soft);border-radius:10px;padding:8px 12px;border-inline-start:4px solid var(--brand)}
.stat small{display:block;color:var(--mute);font-size:14px;line-height:1.4}
.stat b{font-size:20px}
.in{color:var(--in)}.out{color:var(--out)}.due{color:var(--due)}
label{display:block;font-size:14px;color:var(--mute);margin:8px 0 2px}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:90px}
.row{display:flex;gap:8px}.row>*{flex:1}
.btn{padding:9px 14px;border:0;border-radius:9px;background:var(--brand);color:var(--on-brand);font:inherit;font-weight:700;cursor:pointer}
.btn.alt{background:var(--soft);color:var(--ink)}
.btn.wa{background:#1e7a52;color:#fff}
.btn.sm{padding:3px 10px;font-size:14px}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,nav button:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .meta{color:var(--mute);font-size:14px;line-height:1.5}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tag{display:inline-block;padding:0 8px;border-radius:6px;font-size:13px;background:var(--soft)}
.empty{color:var(--mute);text-align:center;padding:16px}
.hide{display:none}
.note{font-size:14px;color:var(--mute);background:var(--soft);padding:8px 12px;border-radius:8px}
.scroll{overflow-x:auto}
.mh{font-weight:700;background:var(--soft);padding:2px 10px;border-radius:8px;margin-top:10px}
.tb{width:100%;border-collapse:collapse;font-size:15px}.tb th,.tb td{border-bottom:1px solid var(--line);padding:4px 6px;text-align:right;white-space:nowrap}.tb th{color:var(--mute);font-weight:600;background:var(--soft)}.tb tr:last-child td{border-bottom:0}
#pr{display:none;color:#000;background:#fff}
#pr table{width:100%;border-collapse:collapse;margin:8px 0}#pr th,#pr td{border:1px solid #888;padding:4px 8px;text-align:right}#pr .rc{max-width:400px;margin:0 auto}
@media print{body{background:#fff;color:#000}.wrap{display:none}#pr{display:block}}

/* ---- professional refresh ---- */
body{font-size:16px;-webkit-tap-highlight-color:transparent}
.wrap{padding:0 14px 110px}
.hd{margin:0 -14px 12px;padding:22px 18px 18px;border-radius:0 0 26px 26px;background:linear-gradient(135deg,var(--brand),#2f7ea5);position:relative}
:root[data-theme="dark"] .hd,:root:not([data-theme="light"]) .hd{}
h1{font-size:22px;font-weight:700;letter-spacing:.2px}
.sub{font-size:13px}
nav{position:fixed;inset:auto 0 0 0;top:auto;bottom:0;margin:0;gap:0;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line);box-shadow:0 -4px 16px rgba(0,0,0,.08);z-index:20}
nav button{display:flex;flex-direction:column;align-items:center;gap:0;border:0;background:transparent;box-shadow:none;border-radius:12px;font-size:12.5px;font-weight:600;color:var(--mute);line-height:1.5;padding:4px 2px}
nav button .ic{font-size:21px;line-height:1.3}
nav button.on{background:var(--soft);color:var(--brand)}
.card{border-radius:16px;padding:16px;box-shadow:0 2px 10px rgba(20,40,60,.07)}
.card>b:first-child{font-size:17px}
.stat{border-radius:12px;padding:10px 12px}
.stat b{font-size:21px;font-weight:700}
.btn{border-radius:11px;padding:10px 16px;transition:transform .08s,opacity .15s}
.btn:active{transform:scale(.96);opacity:.9}
input,select,textarea{border-radius:10px;padding:10px 12px;font-size:16px;min-height:44px}
.dts select{text-align:center;padding-inline:4px}
.dts label{text-align:center}
.mh{border-radius:10px;padding:4px 12px}
.item{padding:11px 0}
.tag{padding:1px 9px;border-radius:20px;font-weight:600}
.tag.due{color:var(--due)}
.tb th{position:sticky;top:0}
.tb tr:nth-child(even) td{background:rgba(127,127,127,.05)}
.sec{font-size:13px;color:var(--mute);margin:14px 4px 0;font-weight:700}
#toast{position:fixed;inset:auto 16px calc(84px + env(safe-area-inset-bottom,0px)) 16px;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;text-align:center;z-index:50;opacity:0;pointer-events:none;transition:opacity .25s}
#toast.show{opacity:.95}
#thx{display:none}#thx.show{display:flex;position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.5);align-items:center;justify-content:center;padding:16px}
.thx-b{background:var(--card);color:var(--ink);border-radius:18px;padding:20px;max-width:380px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.3)}
@media print{nav,#toast,.hd,#thx{display:none!important}}
</style>
</head>
<body>
<div class="wrap">
<header class="hd"><h1 id="title">حقانی کمپوزنگ اینڈ سٹیشنری</h1>
<p class="sub">روزنامچہ · کسٹمر کھاتہ · ماہانہ حساب · رپورٹس</p></header>
<div id="inst" style="margin-bottom:6px"><button class="btn alt sm" data-act="inst">📱 موبائل میں انسٹال کریں</button><div id="ihelp" class="note hide" style="margin-top:8px"></div></div>
<nav id="nav"></nav>
<div id="view"></div>
</div>
<div id="toast" role="status"></div>
<div id="pr"></div>
<script>
(function(){
var KEY="dukaan-khata-v1",TYPES={in:"آمد (نقد)",out:"خرچ",credit:"ادھار دیا",pay:"وصولی"};
var S={shop:"حقانی کمپوزنگ اینڈ سٹیشنری",days:7,ep:"03304546248",epOn:true,tpl:"السلام علیکم {name} صاحب،\n{shop} کی طرف سے یاد دہانی: آپ کے ذمے {balance} روپے باقی ہیں۔ براہِ مہربانی جلد ادا فرما دیں۔ شکریہ۔",customers:[],entries:[],cats:["سٹیشنری","فوٹو سٹیٹ","کمپوزنگ","پرنٹنگ","دیگر"]};
try{var raw=localStorage.getItem(KEY);if(raw){S=Object.assign(S,JSON.parse(raw))}}catch(e){}
if(S.shop==="کھاتہ حقانی"){S.shop="حقانی کمپوزنگ اینڈ سٹیشنری"}
var tab="j",date=today(),mon=today().slice(0,7),sel=null,queue=[],qi=0,v=document.getElementById("view");
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function toast(m){var t=document.getElementById("toast");if(!t)return;t.textContent=m;t.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(function(){t.classList.remove("show")},1800)}
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function p2(n){return String(n).padStart(2,"0")}
function fd(s){var p=String(s||"").split("-");return p.length===3?"\u2066"+p[2]+"/"+p[1]+"/"+p[0]+"\u2069":String(s||"")}
function ld(s){var p=String(s||"").split("-");return p.length===3?"\u2066"+(+p[2])+" "+MN[+p[1]-1]+" "+p[0]+"\u2069":""}
function shiftD(s,n){var p=s.split("-"),dt=new Date(+p[0],+p[1]-1,+p[2]+n);return dt.getFullYear()+"-"+p2(dt.getMonth()+1)+"-"+p2(dt.getDate())}
var WD=["اتوار","پیر","منگل","بدھ","جمعرات","جمعہ","ہفتہ"];
function yrOpts(y,sel){var h="",i;for(i=y-6;i<=y+3;i++)h+='<option value="'+i+'"'+(i===sel?' selected':'')+'>'+i+'</option>';return h}
function mOpts(sel){return MN.map(function(n,k){return'<option value="'+(k+1)+'"'+(k+1===sel?' selected':'')+'>'+n+'</option>'}).join("")}
function dsel(iso){var p=iso.split("-"),y=+p[0],m=+p[1],d=+p[2],h="",i;for(i=1;i<=31;i++)h+='<option value="'+i+'"'+(i===d?' selected':'')+'>'+i+'</option>';return'<div class="row dts" dir="ltr"><div><label for="pd">دن / Day</label><select id="pd" data-dp>'+h+'</select></div><div><label for="pm">مہینہ / Month</label><select id="pm" data-dp>'+mOpts(m)+'</select></div><div><label for="py">سال / Year</label><select id="py" data-dp>'+yrOpts(new Date().getFullYear(),y)+'</select></div></div>'}
function msel(){var p=mon.split("-");return'<div class="row dts" dir="ltr"><select id="mm" aria-label="مہینہ">'+mOpts(+p[1])+'</select><select id="my" aria-label="سال">'+yrOpts(new Date().getFullYear(),+p[0])+'</select></div>'}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function fmt(n){return Number(n).toLocaleString("en-PK")}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function catOpts(cur){return'<option value="">— بغیر شعبہ —</option>'+S.cats.map(function(k){return'<option value="'+esc(k)+'"'+(k===cur?' selected':'')+'>'+esc(k)+'</option>'}).join("")}
function isSale(e){return e.type==="in"||e.type==="credit"}
function catData(es){var m={},tot=0,names=[];es.forEach(function(e){if(!isSale(e))return;var k=e.cat||"بغیر شعبہ";if(!m[k]){m[k]={n:k,cash:0,cr:0,cnt:0};names.push(k)}if(e.type==="in")m[k].cash+=e.amt;else m[k].cr+=e.amt;m[k].cnt++;tot+=e.amt});return{rows:names.map(function(k){return m[k]}).sort(function(a,b){return(b.cash+b.cr)-(a.cash+a.cr)}),tot:tot}}
function catBlock(es,pr){var c=catData(es);if(!c.rows.length)return'<div class="empty">اس مدت میں کوئی بِکری درج نہیں (آمد یا ادھار کے ساتھ شعبہ چنیں)</div>';
 var t='<table class="'+(pr?"":"tb")+'"><tr><th>شعبہ</th><th>نقد</th><th>ادھار</th><th>کل بِکری</th><th>حصہ</th></tr>'+c.rows.map(function(x){var s=x.cash+x.cr;return'<tr><td>'+esc(x.n)+'</td><td>'+fmt(x.cash)+'</td><td>'+fmt(x.cr)+'</td><td><b>'+fmt(s)+'</b></td><td>'+Math.round(s*100/c.tot)+'%</td></tr>'}).join("")+'<tr><td><b>کل</b></td><td></td><td></td><td><b>'+fmt(c.tot)+'</b></td><td></td></tr></table>';
 if(pr)return t;
 return'<div class="scroll">'+t+'</div>'+c.rows.map(function(x){var s=x.cash+x.cr;return'<div style="margin-top:8px"><div class="meta">'+esc(x.n)+' — '+fmt(s)+'</div><div style="background:var(--soft);border-radius:6px"><div style="width:'+Math.max(2,Math.round(s*100/c.tot))+'%;background:var(--brand);height:8px;border-radius:6px"></div></div></div>'}).join("")}
function itemNames(){var s={},a=[];S.entries.forEach(function(e){if(e.item&&!s[e.item]){s[e.item]=1;a.push(e.item)}});return a}
function itemData(es){var m={},a=[];es.forEach(function(e){if(!e.item||e.type==="pay")return;var x=m[e.item];if(!x){x=m[e.item]={n:e.item,bq:0,ba:0,sq:0,sa:0};a.push(x)}if(e.type==="out"){x.bq+=e.qty||0;x.ba+=e.amt}else{x.sq+=e.qty||0;x.sa+=e.amt}});return a}
function stockAt(n,upto){var q=0;S.entries.forEach(function(e){if(e.item===n&&e.type!=="pay"&&e.date<upto)q+=(e.type==="out"?1:-1)*(e.qty||0)});return q}
function shiftM(m,d){var p=m.split("-"),dt=new Date(+p[0],+p[1]-1+d,1);return dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")}
function itemBlock(es,pr){var a=itemData(es);if(!a.length)return'<div class="empty">اس مہینے کسی چیز کی خرید/بِکری درج نہیں (اندراج میں "چیز کا نام" اور مقدار لکھیں)</div>';var up=shiftM(mon,1)+"-01";var t='<table class="'+(pr?"":"tb")+'"><tr><th>چیز</th><th>خریدا</th><th>خرید کی رقم</th><th>بیچا</th><th>بِکری کی رقم</th><th>ماہ کے آخر میں مال باقی</th></tr>'+a.map(function(x){return'<tr><td>'+esc(x.n)+'</td><td>'+fmt(x.bq)+'</td><td>'+fmt(x.ba)+'</td><td>'+fmt(x.sq)+'</td><td>'+fmt(x.sa)+'</td><td><b>'+fmt(stockAt(x.n,up))+'</b></td></tr>'}).join("")+'</table>';return pr?t:'<div class="scroll">'+t+'</div>'}
function cust(id){return S.customers.filter(function(c){return c.id===id})[0]}
function bal(id){var b=0;S.entries.forEach(function(e){if(e.cid===id){if(e.type==="credit")b+=e.amt;if(e.type==="pay")b-=e.amt}});return b}
function phone(p){var d=String(p||"").replace(/\D/g,"");if(d.indexOf("00")===0)d=d.slice(2);else if(d.charAt(0)==="0")d="92"+d.slice(1);return d}
function msg(c,tpl){return (tpl||S.tpl).replace(/\{name\}/g,c.name).replace(/\{shop\}/g,S.shop).replace(/\{balance\}/g,fmt(bal(c.id)))+epLine()}
function epLine(){var n=String(S.ep||"").trim();return(S.epOn!==false&&n)?"\n\nاگر آپ کے پاس ایزی پیسہ کی سہولت موجود ہو تو میرے ایزی پیسہ نمبر "+n+" پر رقم بھیجیں۔":""}
function waUrl(c,text){return"https://wa.me/"+phone(c.phone)+"?text="+encodeURIComponent(text)}
function smsUrl(c,text){return"sms:+"+phone(c.phone)+"?body="+encodeURIComponent(text)}
function entryMsg(e){var c=cust(e.cid);if(!c)return"";
 if(e.type==="credit")return"السلام علیکم "+c.name+" صاحب،\n"+S.shop+" سے "+fmt(e.amt)+" روپے کا ادھار درج ہوا۔ کل باقی: "+fmt(bal(c.id))+" روپے۔ شکریہ۔"+epLine();
 return"السلام علیکم "+c.name+" صاحب،\n"+thxLine(e)+(bal(c.id)>0?epLine():"")+"\n"+S.shop}
function thxLine(e){var c=cust(e.cid),b=bal(c.id);return b<=0?"آپ نے تمام رقم ادا کر دی ہے۔ بہت بہت شکریہ!":"آپ کا بہت شکریہ! آپ نے "+fmt(e.amt)+" روپے ادا کیے اور "+fmt(b)+" روپے باقی رہ گئے ہیں۔"}
function daysSince(t){return t?Math.floor((Date.now()-t)/864e5):9999}
function isDue(c){return bal(c.id)>0&&daysSince(c.last)>=S.days}
function open(u){window.open(u,"_blank","noopener")}
var thxE=null;
function thanks(e){thxE=e;var c=cust(e.cid),b=bal(c.id),full=b<=0,m=document.getElementById("thx");if(!m){m=document.createElement("div");m.id="thx";document.body.appendChild(m)}
 m.innerHTML='<div class="thx-b" role="dialog" aria-modal="true"><div style="font-size:42px;text-align:center">'+(full?"🎉":"🙏")+'</div><h3 style="text-align:center;margin:6px 0">'+esc(c.name)+' صاحب کا شکریہ</h3><p style="text-align:center;line-height:1.9;margin:8px 0">'+esc(thxLine(e))+'</p><div class="grid"><div class="stat"><small>ادا کی گئی رقم</small><b class="in">'+fmt(e.amt)+'</b></div><div class="stat"><small>باقی رقم</small><b class="'+(full?"in":"due")+'">'+fmt(Math.max(b,0))+'</b></div></div><div class="acts" style="justify-content:center;margin-top:12px">'+(c.phone?'<button class="btn wa sm" data-act="thxW">واٹس ایپ پر بھیجیں</button><button class="btn alt sm" data-act="thxS">ایس ایم ایس</button>':'')+'<button class="btn alt sm" data-act="thxX">بند کریں</button></div></div>';m.className="show"}
function printHtml(h){document.getElementById("pr").innerHTML=h;window.print()}
function head(){return'<h2 style="text-align:center;margin:0">'+esc(S.shop)+'</h2><hr style="border:0;border-top:2px solid #000;margin:6px 0 10px">'}
function prE(e){var c=cust(e.cid);printHtml('<div class="rc">'+head()+'<p style="text-align:center;margin:0">رسید نمبر: '+e.id.slice(-5).toUpperCase()+'</p><table><tr><th>تاریخ</th><td>'+fd(e.date)+'</td></tr><tr><th>قسم</th><td>'+TYPES[e.type]+'</td></tr>'+(c?'<tr><th>کسٹمر</th><td>'+esc(c.name)+'</td></tr>':'')+'<tr><th>تفصیل</th><td>'+esc(e.note)+'</td></tr><tr><th>رقم</th><td><b>'+fmt(e.amt)+' روپے</b></td></tr>'+(c?'<tr><th>موجودہ باقی</th><td>'+fmt(bal(c.id))+' روپے</td></tr>':'')+'</table><p style="text-align:center">'+(c&&e.type==="pay"?esc(thxLine(e)):"شکریہ")+'</p></div>')}
function prC(c){var es=S.entries.filter(function(e){return e.cid===c.id});printHtml(head()+'<p>کھاتہ: <b>'+esc(c.name)+'</b> '+esc(c.phone||'')+'</p><table><tr><th>تاریخ</th><th>قسم</th><th>تفصیل</th><th>رقم</th></tr>'+es.map(function(e){return'<tr><td>'+fd(e.date)+'</td><td>'+TYPES[e.type]+'</td><td>'+esc(e.note)+'</td><td>'+fmt(e.amt)+'</td></tr>'}).join('')+'</table><p><b>کل باقی رقم: '+fmt(bal(c.id))+' روپے</b></p><p>پرنٹ کی تاریخ: '+fd(today())+'</p>')}
